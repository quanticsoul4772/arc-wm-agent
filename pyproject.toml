[project]
name = "arc-wm-agent"
version = "0.1.0"
description = "ARC-AGI-3 agent with an enforced, held-out-confirmed executable world model (clean-room implementation)."
requires-python = ">=3.12,<3.13"
dependencies = ["arc-agi==0.9.9", "arcengine==0.9.3", "numpy", "pillow", "requests"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120
